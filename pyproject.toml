[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idfs"
version = "0.1.0"
description = "Intelligent Demand Forecasting System — uncertainty-aware, cost-optimised forecasting and inventory decisions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Pamdem Ravi Charan Reddy" },
    { name = "Jaiti Vijaya Shravani" },
    { name = "Vankayalapati Srujana" },
    { name = "Pottipothu V M Krishna Swamy" },
]

dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<2",
    "xgboost>=2.0,<3",
    "statsmodels>=0.14,<1",
    "plotly>=5.18,<6",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
    "streamlit>=1.30,<2",
    "pyyaml>=6.0,<7",
    "pyarrow>=14,<20",
    "holidays>=0.40,<1",
]

[project.optional-dependencies]
prophet = ["prophet>=1.1,<2"]
lstm = ["torch>=2.1,<3"]
shap = ["shap>=0.44,<1"]
all = ["idfs[prophet,lstm,shap]"]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=4.1,<6",
    "ruff>=0.4,<1",
    "mypy>=1.8,<2",
    "pandas-stubs>=2.1",
    "types-PyYAML>=6.0",
]

[project.scripts]
idfs = "idfs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/idfs"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["idfs"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "xgboost.*",
    "statsmodels.*",
    "prophet.*",
    "torch.*",
    "shap.*",
    "plotly.*",
    "streamlit.*",
    "holidays.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: integration tests",
    "smoke: smoke tests",
]
